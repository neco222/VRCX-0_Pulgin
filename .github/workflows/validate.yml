name: Validate official plugin store
on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'plugins/**'
      - 'index.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'plugins/**'
      - 'index.json'
  workflow_dispatch:
concurrency:
  group: validate-store-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/tests/*.test.mjs
      - run: node .github/scripts/store-index.mjs --check
